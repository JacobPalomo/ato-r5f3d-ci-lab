name: R5F-3F - Chatwoot HTTP contract (isolated CI)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ato-r5f3d-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-http-contract:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CI: 'true'
      R5F3D_JOB: 'true'
      R5F3F_ENABLED: 'true'
    steps:
      - name: Checkout isolated test repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run ephemeral Chatwoot Rails HTTP contract
        shell: bash
        run: bash scripts/run_r5f3d_ci.sh
      - name: Archive sanitized verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ato-r5f3f-http-contract-report
          path: |
            reports/ato-r5f3d-result.json
            reports/ato-r5f3f-result.json
          if-no-files-found: warn
          retention-days: 7

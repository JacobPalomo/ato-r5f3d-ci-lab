name: R5F-3H - Native agent API handoff (isolated CI)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ato-r5f3d-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-agent-handoff:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CI: 'true'
      R5F3D_JOB: 'true'
      R5F3G_ENABLED: 'true'
      R5F3H_ENABLED: 'true'
    steps:
      - name: Checkout isolated synthetic CI repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise authenticated native Chatwoot API with transactional takeover
        shell: bash
        run: bash scripts/run_r5f3d_ci.sh
      - name: Archive sanitized verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ato-r5f3h-native-agent-report
          path: |
            reports/ato-r5f3d-result.json
            reports/ato-r5f3h-result.json
          if-no-files-found: warn
          retention-days: 7

name: R5F-3E - Chatwoot real model write (isolated CI)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ato-r5f3d-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  synthetic-chatwoot-write:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CI: 'true'
      R5F3D_JOB: 'true'
      R5F3E_ENABLED: 'true'
    steps:
      - name: Checkout isolated test repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare schema and execute real Chatwoot message write
        shell: bash
        run: bash scripts/run_r5f3d_ci.sh
      - name: Archive sanitized verdict (even when failed)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ato-r5f3e-functional-report
          path: |
            reports/ato-r5f3d-result.json
            reports/ato-r5f3e-result.json
          if-no-files-found: warn
          retention-days: 7

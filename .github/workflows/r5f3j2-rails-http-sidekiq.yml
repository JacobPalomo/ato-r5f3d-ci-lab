name: R5F-3J-02 - Rails HTTP + Sidekiq fake WhatsApp (isolated CI)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ato-r5f3d-isolated-${{ github.ref }}
  cancel-in-progress: false
jobs:
  rails-http-sidekiq:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      CI: 'true'
      R5F3D_JOB: 'true'
      R5F3J2_ENABLED: 'true'
    steps:
      - name: Checkout synthetic CI-only lab
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Rails native HTTP contract and Sidekiq fake WhatsApp
        shell: bash
        run: bash scripts/run_r5f3d_ci.sh
      - name: Archive sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ato-r5f3j2-rails-http-sidekiq-report
          path: |
            reports/ato-r5f3d-result.json
            reports/ato-r5f3j2-result.json
          if-no-files-found: warn
          retention-days: 7
